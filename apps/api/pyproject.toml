[project]
name = "smart-ats-api"
version = "0.0.0"
description = "Smart ATS FastAPI backend and Celery workers"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic~=1.20.0",
    "celery[redis]~=5.6.0",
    "fastapi~=0.141.0",
    "psycopg[binary]~=3.3.6",
    "pwdlib[argon2]~=0.3.1",
    "sqlalchemy[asyncio]~=2.1.4",
    "uvicorn[standard]~=0.54.0",
    "watchfiles~=1.3.0",
]

[dependency-groups]
dev = [
    "httpx~=0.28.1",
    "pytest~=9.0",
    "pytest-asyncio~=1.4.0",
    "testcontainers[postgres]~=4.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
# One loop for all async tests: the cached async engine's pooled connections are bound to it.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
