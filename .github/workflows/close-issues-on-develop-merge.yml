name: Close linked issues on merge to develop

# GitHub only auto-closes "Closes #N" when merging into the default branch (main).
on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  issues: write

jobs:
  close:
    if: ${{ github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ISSUES=$(grep -oiP '(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\K\d+' <<< "$PR_BODY" | sort -u || true)
          [ -z "$ISSUES" ] && { echo "No linked issue found"; exit 0; }

          for ISSUE in $ISSUES; do
            gh issue close "$ISSUE" --comment "Closed by #$PR_NUMBER (merged into develop)." && echo "Issue #$ISSUE closed"
          done
