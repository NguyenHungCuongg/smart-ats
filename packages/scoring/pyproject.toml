[project]
name = "smart-ats-scoring"
version = "0.0.0"
description = "Smart ATS scoring library: Document Extraction, JD/CV parsing, Blind Profile"
requires-python = ">=3.13,<3.14"
dependencies = [
    "openai~=3.29.0",
    "pypdf[crypto]~=6.20.1",
    "python-docx~=1.2.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
