[project]
name = "smart-ats-api"
version = "0.0.0"
description = "Smart ATS FastAPI backend and Celery workers"
requires-python = ">=3.13,<3.14"
dependencies = [
    "celery[redis]~=5.6.0",
    "fastapi~=0.141.0",
    "uvicorn[standard]~=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest~=9.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
